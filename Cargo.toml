[workspace]
members = ["rust/crates/forge-core", "rust/crates/forge-identity", "rust/crates/forge-recovery", "rust/crates/forge-store", "rust/crates/forge-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
scrypt = "0.11"
subtle = "2"
unicode-normalization = "0.1"
percent-encoding = "2"
ryu-js = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "derive"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
futures-core = "0.3"
futures-util = "0.3"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
